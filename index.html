      // (sinon Chrome/Edge/Samsung le declenchent trop tot et le bouton disparait).
      (function () {
        window.__lovanetInstallEvent = null;
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          window.__lovanetInstallEvent = e;
          window.dispatchEvent(new CustomEvent("lovanet:installready"));
        });
        window.addEventListener("appinstalled", function () {
          window.__lovanetInstallEvent = null;
          window.dispatchEvent(new CustomEvent("lovanet:installed"));
        });
      })();
    </script>

    <script>
      (function () {
        const key = 'lovanet_pwa_diag';
        function push(msg) {
          try {
            const now = new Date().toISOString();
            const arr = JSON.parse(localStorage.getItem(key) || '[]');
            arr.push({ t: now, m: msg });
            localStorage.setItem(key, JSON.stringify(arr.slice(-200)));
          } catch (e) { /* ignore */ }
        }

        // Record service worker registration state
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistration().then((reg) => {
            push('sw.getRegistration -> ' + (reg ? ('active:' + !!reg.active) : 'none'));
          }).catch((e) => push('sw.getRegistration:error '+(e&&e.message)));
        } else {
          push('serviceWorker not supported');
        }

        // Probe the files /sw.js and /manifest.json for headers/status
        fetch('/sw.js', { method: 'HEAD' }).then(r => push('/sw.js HEAD ' + r.status + ' ' + (r.headers.get('content-type')||''))).catch(e => push('/sw.js HEAD error '+(e&&e.message)));
        fetch('/manifest.json', { method: 'HEAD' }).then(r => push('/manifest.json HEAD ' + r.status + ' ' + (r.headers.get('content-type')||''))).catch(e => push('/manifest.json HEAD error '+(e&&e.message)));

        window.addEventListener('beforeinstallprompt', (e) => { push('beforeinstallprompt fired'); window.__lovanetInstallEvent = e; });
        window.addEventListener('appinstalled', () => { push('appinstalled fired'); });

        // Expose a quick viewer if ?showPwaDiag=1
        try {
          const params = new URLSearchParams(location.search);
          if (params.get('showPwaDiag') === '1') {
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.inset = '1rem';
            overlay.style.zIndex = '99999';
            overlay.style.background = 'rgba(0,0,0,0.85)';
            overlay.style.color = '#fff';
            overlay.style.padding = '12px';
            overlay.style.overflow = 'auto';
            overlay.style.fontFamily = 'monospace';
            overlay.style.fontSize = '12px';
            const h = document.createElement('div');
            h.textContent = 'PWA Diagnostics — close with ESC';
            h.style.fontWeight = '700';
            h.style.marginBottom = '8px';
            overlay.appendChild(h);
            const dump = document.createElement('pre');
            dump.style.whiteSpace = 'pre-wrap';
            function render() {
              const arr = JSON.parse(localStorage.getItem(key) || '[]');
              dump.textContent = arr.map(a => '['+a.t+'] '+a.m).join('\n');
            }
            render();
            overlay.appendChild(dump);
            document.body.appendChild(overlay);
            window.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') overlay.remove(); });
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
